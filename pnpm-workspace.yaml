packages:
  - apps/*
  - packages/*

# Install scripts are blocked by default (pnpm >= 10). Approve explicitly, with an ADR,
# only when a dependency truly needs one.
allowBuilds:
  # Denied on purpose: electron >= 44 fetches its binary lazily on first launch.
  electron: false
  electron-winstaller: false

packageExtensions:
  '@peculiar/utils@2.0.3':
    dependencies:
      tslib: 2.8.1
